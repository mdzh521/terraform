apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-otc-prod-log-alerts
  namespace: logging
  labels:
    logging_alerts: disabled
  annotations:
    loki_rule_folder: /rules/fake
data:
  otc-prod-log-errors.yaml: |
    groups:
      - name: otc-prod-log-errors
        interval: 1m
        rules:
          - alert: OtcProdContinuousLogErrors
            expr: |
              sum by (workload, container) (
                count_over_time(
                  {cluster="otc-prod", namespace="otc-prod"}
                  |~ "(?i)(error|fatal|panic|exception)" [1m]
                )
              ) > 0
            for: 5m
            labels:
              cluster: otc-prod
              namespace: otc-prod
              service: '{{ $labels.workload }}'
              severity: warning
            annotations:
              summary: "{{ $labels.workload }} 持续出现错误日志"
              description: "{{ $labels.workload }} / {{ $labels.container }} 连续 5 分钟每分钟都有 error/fatal/panic/exception 日志。"
